services:
  postgres:
    image: postgres:16-alpine
    container_name: rebi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rebi_db}
      POSTGRES_USER: ${POSTGRES_USER:-rebi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Вкажіть POSTGRES_PASSWORD у файлі .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"   # доступ лише з вашого комп'ютера; на сервері цей порт краще прибрати
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rebi_user} -d ${POSTGRES_DB:-rebi_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: rebi_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: postgres://${POSTGRES_USER:-rebi_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rebi_db}
    ports:
      - "5001:5000"   # хост-порт 5001, як у вашого колеги
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: rebi_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
