version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rebi_postgres
    restart: always
    environment:
      POSTGRES_DB: rebi_db
      POSTGRES_USER: rebi_user
      POSTGRES_PASSWORD: rebi_password
    ports:
      - "5432:5432"
    volumes:
      # Автоматично виконає init.sql при першому запуску бази
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend
    container_name: rebi_backend
    ports:
      - "5001:5000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    container_name: rebi_frontend
    ports:
      - "80:80"
    depends_on:
      - backend