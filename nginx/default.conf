# Обмеження частоти запитів для захисту від DDoS / Brute-Force
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# 1. HTTP Сервер (Порт 80) — Перенаправлення на HTTPS та валідація Let's Encrypt
server {
    listen 80;
    listen [::]:80;
    server_name localhost; # При деплої замінюється на ваш домен (наприклад, rebi.ua)

    # Маршрут для автоматичного випуску та оновлення сертифікатів Let's Encrypt (Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Повне перенаправлення з HTTP на HTTPS (301 Permanent Redirect)
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Основний HTTPS Сервер (Порт 443) — Захист класу A+ SSL Labs
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name localhost; # При деплої замінюється на ваш домен

    # Шляхи до SSL-сертифікатів
    ssl_certificate /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;

    # Протоколи та сучасні криптографічні шифри (Вимога для A+)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS (Strict-Transport-Security) — Примушує браузери пам'ятати тільки HTTPS протягом 2 років
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Захисні заголовки (Security Headers)
    add_header X-Frame-Options "DENY" always;                                   # Захист від Clickjacking
    add_header X-Content-Type-Options "nosniff" always;                         # Захист від MIME-sniffing
    add_header X-XSS-Protection "1; mode=block" always;                         # Захист від XSS
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;" always;

    # Обслуговування Фронтенду (Статика HTML/CSS/JS)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Проксіювання та CORS для Бекенд API
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend:5000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # CORS Заголовки
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

        # Обробка Preflight-запитів OPTIONS
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }
}